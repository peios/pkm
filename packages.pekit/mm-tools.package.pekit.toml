# mm-tools — compiled memory-management diagnostics: page-types, slabinfo,
# page_owner_sort, and thp_swap_allocator_test. Built from tools/mm
# (build.tools). The binaries default to sbin and are redirected to bin.
#
# thpmaps (NumPy), slabinfo-gnuplot (gnuplot), and show_page_info (drgn) remain
# in the corresponding-source package until those optional runtimes are packaged.
# Upstream has no manuals for these; the pages are Peios' own (build/man/),
# except for thp_swap_allocator_test, which upstream calls a test
# (lint.pekit.toml).

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db.
side_effects = ["man-db"]

[package]
name = "dev.peios.mm-tools"
description = "Memory-management diagnostics (from Linux 7.0.9 tools/mm)"

[files]
"@source:COPYING" = "usr/share/licenses/dev.peios.mm-tools/COPYING"
"tools:usr/bin/page-types"               = "usr/bin/page-types"
"tools:usr/bin/slabinfo"                 = "usr/bin/slabinfo"
"tools:usr/bin/page_owner_sort"          = "usr/bin/page_owner_sort"
"tools:usr/bin/thp_swap_allocator_test"  = "usr/bin/thp_swap_allocator_test"
"tools:usr/share/man/man8/page-types.8.gz"      = "usr/share/man/man8/page-types.8.gz"
"tools:usr/share/man/man8/slabinfo.8.gz"        = "usr/share/man/man8/slabinfo.8.gz"
"tools:usr/share/man/man1/page_owner_sort.1.gz" = "usr/share/man/man1/page_owner_sort.1.gz"
