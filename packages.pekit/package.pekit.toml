# Base metadata for the Peios kernel packages, inherited by each
# <name>.package.pekit.toml; each overrides description + files. Covers the
# kernel family (kernel, kernel-headers, kernel-devel, kernel-debuginfo,
# kernel-debugsource) and the in-tree userspace tools (perf, bpftool, cpupower,
# turbostat, rtla, rv) — all built from the same Linux 7.0.9 source, all
# x86_64 / GPL-2.0-only.
#
# The Peios kernel version is INDEPENDENT of the Linux base it's built on
# (the base is provenance, recorded in each package's description). SemVer it
# against the PKM UAPI / KACS ABI. Install paths are named by the kernel
# RELEASE (7.0.9, the uname version) — distinct from this package version.
#
# The production kernel is modular: Arch's module set is built as signed modules
# and shipped in kernel-modules, while everything the boot path needs stays
# built-in via pkm.fragment, so the kernel boots with no modules loaded. The
# KUnit profile remains monolithic — the test kernel must not depend on the
# module stack to boot.

format = "peipkg"

[package]
# -16: stratafs gains its conformance-test apparatus: the stratafs: tracepoint
# system (d_revalidate verdicts) and the test rendezvous/fail points of TRM
# §4.A.2 (CONFIG_STRATAFS_FS_TEST_HOOKS) — compiled in, registered only when
# booted with stratafs.test_hooks=1, which only the provium profiles pass.
#
# -15: KACS invalidates an inode's cached security descriptor when a canonical
# descriptor xattr lands on it. A descriptor set through a stacking filesystem
# reaches a second inode the set-security path never sees, and that inode could
# keep serving the descriptor the object was created with (PEI-564).
#
# -14: KACS resolves an overlay create in the overlay's own terms (PEI-564).
# A file or directory created on the live root now inherits from the directory
# the caller named, as the caller -- not from a backing upper or work directory
# as the mounter -- so CREATOR OWNER resolves to the principal that made the
# object and a runtime `sd set` governs the children that follow it. An explicit
# creator descriptor from a native create is honoured on an overlay too.
# -17: PNP — the Peios Network Policy packet engine (PEI-598). net/pnp
# subtree at the ratified seats, pnp-core rules engine in the Rust island,
# registry ingestion via LCS with a depth-unbounded rules watch, nftables
# and the xtables family configured out (the clean slate), and the
# dev-baseline policy seed (regim/pnp-rules.reg) that arms enforcement on
# images that autoapply it.
# -19: the PNP verdict event stream — /dev/peios-pnp drains one record per
# evaluation (verdict, attribution, tuple; drops confessed) and the STATUS
# ioctl reports generation/enforcing/stats/last-ingest. ABI: <pkm/pnp.h>,
# experimental. (-18: conntrack pinned at init.)
version      = "{{version}}-21"
architecture = "x86_64"
license      = "GPL-2.0-only"
homepage     = "https://github.com/peios/pkm"
