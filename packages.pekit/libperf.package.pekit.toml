# libperf — perf's sampling/eventing shared library (runtime SONAME + real).
# Built from tools/lib/perf (build.tools). perf itself links libperf statically,
# so this is for other consumers of the library.
#
# Runtime ELF dependencies are derived from the staged library.

[package]
name = "dev.peios.libperf"
description = "libperf - perf events/sampling shared library"

[provides]
"libperf" = "{{version}}-1"

[replaces]
"libperf" = "<= 0.20.1-rc12-26"

[files]
"@source:COPYING" = "usr/share/licenses/dev.peios.libperf/COPYING"
"tools:usr/lib/x86_64-linux-peios/libperf.so.0"     = "usr/lib/x86_64-linux-peios/libperf.so.0"
"tools:usr/lib/x86_64-linux-peios/libperf.so.0.0.1" = "usr/lib/x86_64-linux-peios/libperf.so.0.0.1"
