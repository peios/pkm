# cgroup-tools — the standalone cgroup diagnostic scripts which only require
# Python's standard library. The drgn-based iocost_monitor and memcg_slabinfo
# remain in the corresponding-source package until Peios packages drgn.
#
[package]
name = "dev.peios.cgroup-tools"
architecture = "noarch"
description = "cgroup-tools - standalone cgroup diagnostics (from Linux 7.0.9 tools/cgroup)"

[dependencies]
"org.python.python3" = ">= 3.14, < 3.15"

[provides]
"cgroup-tools" = "{{version}}-1"

[replaces]
"cgroup-tools" = "<= 0.20.1-rc12-26"

[files]
"@source:COPYING" = "usr/share/licenses/dev.peios.cgroup-tools/COPYING"
"tools:usr/bin/iocost_coef_gen" = "usr/bin/iocost_coef_gen"
"tools:usr/bin/memcg_shrinker"  = "usr/bin/memcg_shrinker"
