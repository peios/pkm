# kvm_stat — live KVM event/exit-reason monitor (reads the KVM debugfs/tracepoint
# counters). A standalone Python script, from tools/kvm/kvm_stat (build.tools).
# The bundled kvm_stat.service systemd unit is not shipped (Peios is not systemd).
#
# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name = "dev.peios.kvm-stat"
architecture = "noarch"
description = "kvm_stat - KVM event monitor (from Linux 7.0.9 tools/kvm/kvm_stat)"

[dependencies]
"org.python.python3" = ">= 3.14, < 3.15"

[files]
"@source:COPYING" = "usr/share/licenses/dev.peios.kvm-stat/COPYING"
"tools:usr/bin/kvm_stat"                = "usr/bin/kvm_stat"
"tools:usr/share/man/man1/kvm_stat.1.gz" = "usr/share/man/man1/kvm_stat.1.gz"
