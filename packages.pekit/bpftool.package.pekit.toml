# bpftool — inspect and manipulate eBPF programs, maps, and BTF. Built from the
# in-tree tools/bpf/bpftool (build.tools). The kernel enables BPF/BPF_SYSCALL/
# BPF_JIT, so bpftool has live kernel support.
#
# Runtime ELF dependencies are derived from the staged binary.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name = "dev.peios.bpftool"
description = "eBPF program, map and BTF introspection (from Linux 7.0.9 tools/bpf/bpftool)"

# bpftool's Makefile installs to /usr/sbin; PSD-009 §3.4.1 has no sbin (Peios is
# bin-only), and bpftool has no compiled-in self-path, so relocate it to usr/bin.
[files]
"@source:COPYING" = "usr/share/licenses/dev.peios.bpftool/COPYING"
"tools:usr/sbin/bpftool" = "usr/bin/bpftool"
"tools:usr/share/bash-completion/completions/bpftool" = "usr/share/bash-completion/completions/bpftool"
"tools:usr/share/man/man8/bpftool*.8.gz" = "usr/share/man/man8"
