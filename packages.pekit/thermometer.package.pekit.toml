# thermometer — sample and log thermal-zone temperatures over time (libconfig
# policy). Built from tools/thermal/thermometer (build.tools; no install target,
# so the binary is copied).
#
# Runtime ELF dependencies are derived from the staged binary; the exact
# sibling helper-library package is declared below. Upstream's thermometer.8 is
# installed by build.tools; there is no install target to do it.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db.
side_effects = ["man-db"]

[package]
name = "dev.peios.thermometer"
description = "Thermal-zone temperature logger (from Linux 7.0.9 tools/thermal)"

[dependencies]
"dev.peios.libthermal-tools" = "= {{version}}-1"

[provides]
"thermometer" = "{{version}}-1"

[replaces]
"thermometer" = "<= 0.20.1-rc12-26"

[files]
"@source:COPYING" = "usr/share/licenses/dev.peios.thermometer/COPYING"
"tools:usr/bin/thermometer" = "usr/bin/thermometer"
"tools:usr/share/man/man8/thermometer.8.gz" = "usr/share/man/man8/thermometer.8.gz"
