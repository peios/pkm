# x86_energy_perf_policy — read/set the IA32_ENERGY_PERF_BIAS MSR (perf/energy
# bias hint). Built from tools/power/x86/x86_energy_perf_policy (build.tools).
#
# Runtime shared-lib deps (TODO — see D4): libc

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
description = "x86_energy_perf_policy — set CPU energy/performance bias (from Linux 7.0.9 tools/power/x86)"

[files]
"tools:usr/bin/x86_energy_perf_policy" = "usr/bin/x86_energy_perf_policy"
"tools:usr/share/man/man8/x86_energy_perf_policy.8" = "usr/share/man/man8/x86_energy_perf_policy.8"
