# tmon — ncurses monitor for the thermal subsystem (zones, cooling devices).
# Built from tools/thermal/tmon (build.tools).
#
# Runtime ELF dependencies are derived from the staged binary. Upstream's
# tmon.8 is installed by build.tools; its Makefile does not install it.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db.
side_effects = ["man-db"]

[package]
name = "dev.peios.tmon"
description = "Thermal subsystem monitor (from Linux 7.0.9 tools/thermal/tmon)"

[files]
"@source:COPYING" = "usr/share/licenses/dev.peios.tmon/COPYING"
"tools:usr/bin/tmon" = "usr/bin/tmon"
"tools:usr/share/man/man8/tmon.8.gz" = "usr/share/man/man8/tmon.8.gz"
