# tmon — ncurses monitor for the thermal subsystem (zones, cooling devices).
# Built from tools/thermal/tmon (build.tools).
#
# Runtime ELF dependencies are derived from the staged binary.

[package]
name = "dev.peios.tmon"
description = "tmon - thermal subsystem monitor (from Linux 7.0.9 tools/thermal/tmon)"

[provides]
"tmon" = "{{version}}-1"

[replaces]
"tmon" = "<= 0.20.1-rc12-26"

[files]
"@source:COPYING" = "usr/share/licenses/dev.peios.tmon/COPYING"
"tools:usr/bin/tmon" = "usr/bin/tmon"
