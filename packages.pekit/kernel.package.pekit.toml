# kernel — the bootable Peios kernel: the monolithic bzImage plus the matching
# config and System.map. Monolithic (all drivers built in) is a temporary
# early-development simplification, not the production shape; while it holds there
# is no kernel-core / kernel-modules split. Carved straight from build.kernel's
# output; files named by the kernel release (uname), package by the Peios version.

[package]
description = "Peios Kernel - bootable image (based on Linux 7.0.9)"

# The Linux version this kernel is built from, as a versioned virtual name —
# the same treatment kernel-headers gives its UAPI, and for the same reason:
# the package version is pkm's SemVer against the PKM UAPI / KACS ABI, so it
# cannot answer "which Linux is this?". Anything gated on a Linux feature or
# syscall asks for linux-kernel instead.
#
# MUST equal [env] KERNEL_VERSION in the recipe, without the leading "v";
# build.kernel asserts it.
[provides]
linux-kernel = "7.0.9"

# The kernel image ships beside its own modules, under the release-named
# directory: with UKIs nothing boots from a firmware-visible path, so the
# kernel is ordinary package content rather than something /boot must hold.
# Filenames keep the release suffix, so a tree carrying two kernels stays
# self-describing and the `vmlinuz-*` globs that locate it still work.
[files]
"kernel:arch/x86/boot/bzImage" = "usr/lib/modules/7.0.9-peios-{{version}}/vmlinuz-7.0.9-peios-{{version}}"
"kernel:System.map"            = "usr/lib/modules/7.0.9-peios-{{version}}/System.map-7.0.9-peios-{{version}}"
"kernel:.config"               = "usr/lib/modules/7.0.9-peios-{{version}}/config-7.0.9-peios-{{version}}"
