out_dir = "out"

# Single source of truth for the upstream Linux version, exported into every
# build stage's environment (build.upstream clones this tag). Bump it here, in
# lockstep with the patch series — kernel/patches are generated against this
# exact tag, so a version change generally means re-deriving or 3-way-rebasing
# them. Note: package install paths still embed the kernel RELEASE literally;
# pekit's version templating carries the Peios version, not the kernel version.
[env]
KERNEL_VERSION = "v7.0.9"

[build.upstream]
command = """
# Clone the pinned upstream kernel ($KERNEL_VERSION, from [env] above).
git clone --depth 1 --branch "$KERNEL_VERSION" \
	https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
	"$PEKIT_OUT"

# Source-level prep hook: nothing needed today (patches apply to a pristine
# tree). Config/toolchain prep belongs to the later build stages, not here.
"""

# Just clones the pinned upstream tag over HTTPS.
[build.upstream.dependencies.peipkg]
git = "*"
ca-certificates = "*"

[build.upstream.dependencies.apt]
git = "*"
ca-certificates = "*"

[build.source]
needs = ["upstream"]
command = """
PATCHES="$(pwd)/kernel/patches"
cp -aT "$PEKIT_UPSTREAM_OUT" "$PEKIT_OUT"
./kernel/apply-patches.sh $PEKIT_OUT $PATCHES
./kernel/stage-sources.sh "$(pwd)" "$PEKIT_OUT"
# .git is only needed for `git apply` above. Strip it so the staged source is a
# plain tree: scripts/setlocalversion then finds no repo and the kernel release
# is a clean "7.0.9" instead of "7.0.9-dirty" (HEAD sits on the v7.0.9 tag and
# the applied patches leave the worktree dirty).
rm -rf "$PEKIT_OUT/.git"
"""

# apply-patches.sh uses git apply + patch; stage-sources.sh uses patch + python3.
[build.source.dependencies.peipkg]
git = "*"
patch = "*"
python3 = "*"

[build.source.dependencies.apt]
git = "*"
patch = "*"
python3 = "*"

# build.source is config-agnostic (the kernel-source package). The kernel
# stages take it, configure for a profile, and compile a monolithic bzImage.

[build.kunit]
needs = ["source"]
command = """
cp -aT "$PEKIT_SOURCE_OUT" "$PEKIT_OUT"
./build/configure-kernel.sh "$PEKIT_OUT" kunit
./build/compile-kernel.sh "$PEKIT_OUT"
"""

# Full kernel build: the LLVM toolchain (clang/lld/llvm + libclang for bindgen —
# in the peipkg pool libclang.so and the resource headers ride inside the clang
# package, so no clang-devel there), plus the classic kernel C build deps — bc,
# bison, flex, libelf (CONFIG/objtool), openssl (cert/sig), dwarves/pahole (BTF),
# cpio (initramfs), kmod, python3, perl.
# The Rust toolchain: on the apt side it is NOT a distro package — the
# pkm-build container's rustup provides it via the env/wrap. On the peipkg
# side rust (rustc+cargo+rustfmt+rust-src) and bindgen ARE pool packages,
# declared below; the kernel enter wrapper points RUST_LIB_SRC at the
# triplet-dir rustlib the rust package ships.
[build.kunit.dependencies.peipkg]
build-essentials = "*"
bash = "*"
gzip = "*"
zstd = "*"
rust = "*"
bindgen = "*"
gcc = "*"
"gcc-c++" = "*"
make = "*"
clang = "*"
lld = "*"
llvm = "*"
bc = "*"
bison = "*"
flex = "*"
"elfutils-devel" = "*"
openssl-devel = "*"
openssl = "*"
pahole = "*"
cpio = "*"
kmod = "*"
python3 = "*"
perl = "*"

[build.kunit.dependencies.apt]
build-essential = "*"
clang-18 = "*"
lld-18 = "*"
llvm-18 = "*"
libclang-18-dev = "*"
bc = "*"
bison = "*"
flex = "*"
libelf-dev = "*"
libssl-dev = "*"
openssl = "*"
dwarves = "*"
cpio = "*"
kmod = "*"
python3 = "*"
perl = "*"

[build.kernel]
needs = ["source"]
command = """
# Same assertion as build.headers, for `linux-kernel` — see that stage.
sh ./kernel/verify-linux-provide.sh \
	packages.pekit/kernel.package.pekit.toml \
	linux-kernel "$KERNEL_VERSION" "$PEKIT_SOURCE_OUT"

cp -aT "$PEKIT_SOURCE_OUT" "$PEKIT_OUT"
# Inject the production TCB signing key over the allow-empty placeholder that
# build.source stages. Provide it via the keyring: --keyring.tcb.pub=<hex>.
python3 kernel/scripts/generate-kacs-builtin-signing-keys.py \
	--pubkey-hex "$PEKIT_KEYRING_TCB_PUB" \
	--out "$PEKIT_OUT/security/pkm/kacs/builtin_signing_keys.h"
./build/configure-kernel.sh "$PEKIT_OUT" production "-peios-$PEKIT_VERSION"
./build/compile-kernel.sh "$PEKIT_OUT"
"""

# Same toolchain as build.kunit (production profile); the keygen step adds python3
# (already required). Rust toolchain comes from the build env/wrap, as above.
[build.kernel.dependencies.peipkg]
build-essentials = "*"
bash = "*"
gzip = "*"
zstd = "*"
rust = "*"
bindgen = "*"
gcc = "*"
"gcc-c++" = "*"
make = "*"
clang = "*"
lld = "*"
llvm = "*"
bc = "*"
bison = "*"
flex = "*"
"elfutils-devel" = "*"
openssl-devel = "*"
openssl = "*"
pahole = "*"
cpio = "*"
kmod = "*"
python3 = "*"
perl = "*"

[build.kernel.dependencies.apt]
build-essential = "*"
clang-18 = "*"
lld-18 = "*"
llvm-18 = "*"
libclang-18-dev = "*"
bc = "*"
bison = "*"
flex = "*"
libelf-dev = "*"
libssl-dev = "*"
openssl = "*"
dwarves = "*"
cpio = "*"
kmod = "*"
python3 = "*"
perl = "*"

# Export the sanitized userspace UAPI headers (full Linux UAPI + our pkm/*.h,
# which ride along since they're staged under include/uapi/pkm). Depends on
# source, not the compiled kernel — headers come from include/uapi and need no
# build. O= directs the host-tool build (unifdef) + the headers into this
# stage's own out, leaving the source tree pristine and avoiding a tree copy.
# (headers_install is a transformation the package [files] maps can't do;
# everything else the kernel packages need is carved straight from build.kernel.)
[build.headers]
needs = ["source"]
command = """
# kernel-headers publishes the Linux version as `linux-kernel-headers`, a
# versioned virtual provide, so consumers can require a UAPI level without
# depending on pkm's SemVer (which tracks the PKM/KACS ABI, not Linux). That
# provide is static TOML, so assert it against KERNEL_VERSION and against the
# staged tree rather than trusting the two were bumped together.
sh ./kernel/verify-linux-provide.sh \
	packages.pekit/kernel-headers.package.pekit.toml \
	linux-kernel-headers "$KERNEL_VERSION" "$PEKIT_SOURCE_OUT"

make -C "$PEKIT_SOURCE_OUT" O="$PEKIT_OUT" LLVM="${PKM_LLVM:--18}" ${PKM_HOSTCC:+HOSTCC="$PKM_HOSTCC"} headers_install INSTALL_HDR_PATH="$PEKIT_OUT/usr"
"""

# headers_install builds the unifdef host tool with HOSTCC (defaults to
# clang-18 via LLVM=-18 in the container; a composed peipkg root sets
# PKM_LLVM=1 / PKM_HOSTCC=gcc — see build/compile-kernel.sh for the knob
# rationale), so it needs make + the clang toolchain (no kernel C libs);
# the final INSTALL step copies the tree with rsync.
[build.headers.dependencies.peipkg]
build-essentials = "*"
gcc = "*"
make = "*"
clang = "*"
lld = "*"
llvm = "*"
rsync = "*"

[build.headers.dependencies.apt]
build-essential = "*"
clang-18 = "*"
lld-18 = "*"
llvm-18 = "*"
rsync = "*"

# Kernel debug artifacts: the whole vmlinux at the conventional debug path + a
# build-id symlink (-> kernel-debuginfo), and the DWARF-referenced sources with
# their baked-in build path sanitized via debugedit (-> kernel-debugsource).
# objcopy/readelf/debugedit are transformations the package [files] maps can't
# do; everything else the kernel packages need is carved straight from build.kernel.
[build.debuginfo]
needs = ["kernel"]
command = """
./build/make-debuginfo.sh "$PEKIT_KERNEL_OUT" "$PEKIT_OUT"
"""

# Splits vmlinux debug info: debugedit + binutils (readelf/strip/objcopy).
[build.debuginfo.dependencies.peipkg]
build-essentials = "*"
bash = "*"
binutils = "*"
debugedit = "*"
cpio = "*"

[build.debuginfo.dependencies.apt]
binutils = "*"
debugedit = "*"
cpio = "*"

# In-tree userspace tooling (perf, bpftool, cpupower, turbostat, rtla, rv). These
# are userspace ELF programs that live under tools/ in the kernel source, so they
# build from the same staged source (needs=source) rather than a separate pipeline
# — only their userspace lib deps are extra (in the image, unused by build.kernel).
# One stage builds all of them into a DESTDIR image; the per-tool packages carve
# from it. Independent of the compiled kernel.
[build.tools]
needs = ["source"]
command = """
./build/build-tools.sh "$PEKIT_SOURCE_OUT" "$PEKIT_OUT"
"""

# The in-tree userspace tools (perf, bpftool, cpupower, turbostat, rtla, rv) pull
# in the widest dep set — perf's optional integrations dominate. These libs are
# used by build.tools only (never by the kernel build). bison/flex build perf's
# own parsers; the rest are the -dev libs perf/rtla/rv link (see build/Containerfile
# for the per-library rationale).
[build.tools.dependencies.peipkg]
build-essentials = "*"
bash = "*"
which = "*"
rsync = "*"
"openssl-devel" = "*"
gcc = "*"
"gcc-c++" = "*"
make = "*"
bison = "*"
flex = "*"
pkgconf = "*"
"elfutils-devel" = "*"
"zlib-devel" = "*"
"zstd-devel" = "*"
"libcap-devel" = "*"
"numactl-devel" = "*"
"slang-devel" = "*"
"libtraceevent-devel" = "*"
"libtracefs-devel" = "*"
"pciutils-devel" = "*"
gettext = "*"
perl = "*"
binutils = "*"
python3 = "*"
"libpfm-devel" = "*"
"libudev-devel" = "*"
"ncurses-devel" = "*"
"libnl-devel" = "*"
"libconfig-devel" = "*"
autoconf = "*"
automake = "*"
libtool = "*"
"capstone-devel" = "*"
"llvm-devel" = "*"
llvm = "*"
clang = "*"

[build.tools.dependencies.apt]
build-essential = "*"
bison = "*"
flex = "*"
pkg-config = "*"
libdw-dev = "*"
zlib1g-dev = "*"
libzstd-dev = "*"
libcap-dev = "*"
libnuma-dev = "*"
libslang2-dev = "*"
libtraceevent-dev = "*"
libtracefs-dev = "*"
libpci-dev = "*"
gettext = "*"
libperl-dev = "*"
binutils-dev = "*"
python3-dev = "*"
python3-docutils = "*"
python3-setuptools = "*"
libpfm4-dev = "*"
asciidoc = "*"
xmlto = "*"
libudev-dev = "*"
libncurses-dev = "*"
libnl-3-dev = "*"
libnl-genl-3-dev = "*"
libconfig-dev = "*"
autoconf = "*"
automake = "*"
libtool = "*"
libcapstone-dev = "*"
llvm-18-dev = "*"
libbpf-dev = "*"
bpftool = "*"
libcpupower-dev = "*"
libdebuginfod-dev = "*"
systemtap-sdt-dev = "*"
libbabeltrace-dev = "*"
default-jdk = "*"
source-highlight = "*"
python3 = "*"
perl = "*"

# Boot the KUnit kernel in QEMU and assert the suite passes (build vs run split).
[test.kunit]
needs = ["kunit"]
command = """
./build/test-kunit.sh "$PEKIT_KUNIT_OUT"
"""

# Regenerate the language bindings under uapi/generated/{go,lua,rust} from the
# canonical uapi/pkm headers, in place (each gen.sh runs the codegen-safe lint
# first). This is a `gen` target, not a build: its product is committed source,
# not an out/ artifact. Independent of the kernel chain — operates on the
# committed headers. verify_command below is the matching drift gate.
[gen.uapi]
command = """
bash uapi/generated/rust/gen.sh
bash uapi/generated/lua/gen.sh
bash uapi/generated/go/gen.sh
"""

# Drift gate (`pekit verify uapi`): the committed bindings must match a fresh
# regen. Regenerates into the throwaway scratch $PEKIT_OUT — never the tree —
# and diffs. Standalone-compile is a separate concern; it stays in [test.uapi].
verify_command = """
work="$PEKIT_OUT/uapi"
cp -a uapi "$work"
bash "$work/generated/rust/gen.sh"
bash "$work/generated/lua/gen.sh"
bash "$work/generated/go/gen.sh"
if ! diff -ru uapi/generated "$work/generated"; then
	echo "uapi: committed bindings differ from a fresh regen — run 'pekit gen uapi'" >&2
	exit 1
fi
echo "uapi: bindings in sync with uapi/pkm"
"""

# The generated bindings are downstream consumer SDKs: no build target stages
# them (the kernel/headers stages carry the canonical uapi/pkm/*.h, not the
# language mirrors), and no test consumes them. So gate no build and no test
# locally — the drift gate runs on demand via `pekit verify uapi` (and in CI /
# the pre-push hook), not as a pre-flight that would drag the codegen toolchain
# into every kernel build.
verify_on_build = []
verify_on_test = []

# Codegen for the three binding flavours: clang + libclang for the Rust bindgen
# pass, lua for the Lua mirror, golang (go + gofmt) for the Go mirror; python3 for
# the codegen-safe lint. bindgen + rustfmt themselves come from the rustup
# toolchain in the build env/wrap, not a distro package. verify_command uses the
# same toolchain, so no verify_dependencies override is needed.
[gen.uapi.dependencies.peipkg]
clang = "*"
clang-devel = "*"
lua = "*"
golang = "*"
python3 = "*"

[gen.uapi.dependencies.apt]
clang-18 = "*"
libclang-18-dev = "*"
"lua5.4" = "*"
golang-go = "*"
python3 = "*"

# Standalone-compile gate for the UAPI: the canonical headers must compile with
# a stock userspace compiler. This is correctness, not drift (the drift half is
# gen.uapi's verify_command) — so it stays a plain test. No needs; operates on
# the committed uapi/.
[test.uapi]
command = """
bash uapi/check-userspace-clean.sh
"""
