out_dir = "out"

# One corresponding-source artifact covers the kernel and every in-tree tool
# package. Keep its public identity stable even when the catalogue delegates
# into this recipe from a differently named directory.
[source_package]
name = "dev.peios.kernel-source"

# Single source of truth for the upstream Linux version, exported into every
# build stage's environment. Bump it here, in
# lockstep with the patch series — kernel/patches are generated against this
# exact tag, so a version change generally means re-deriving or 3-way-rebasing
# them — and with the [input.linux] pin below, which supplies the tree
# (build.upstream). build.kernel and build.headers assert the staged tree
# against this value, so the two cannot drift silently. Note: package install
# paths still embed the kernel RELEASE literally; pekit's version templating
# carries the Peios version, not the kernel version.
[env]
KERNEL_VERSION = "v7.0.9"

# The pristine upstream kernel this tree is derived from. Pekit fetches it and
# verifies kernel.org's detached signature coordinator-side, then pins its
# bytes in the building recipe's pekit.lock: this repository's own for a
# standalone build, the catalogue recipe's when pkgs/dev.peios.kernel
# delegates here. No build root needs a PGP implementation, and the archive
# stays independently verifiable. It arrives at $PEKIT_INPUT_LINUX.
#
# Exact by design, and pinned separately from the Peios version: the patch
# series is derived against one upstream release, so moving it is a deliberate
# rebase, made here together with KERNEL_VERSION and kernel/patches.
[input.linux]
url         = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-{{version}}.tar.xz"
listing_url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/"
file_regex  = 'linux-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
versions    = "= 7.0.9"
extract     = true
root        = "linux-{{version}}"

# kernel.org signs the uncompressed tar stream. All official kernel tarball
# releases since 4.18 use Greg Kroah-Hartman's release key.
[input.linux.signature]
url          = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-{{version}}.tar.sign"
of           = "decompressed"
key_files    = ["keys/greg-kroah-hartman.asc"]
fingerprints = ["647F28654894E3BD457199BE38DBBDC86092693E"]

[build.upstream]
command = """
set -eu
# The pristine upstream tree, [input.linux] above. Pekit fetched it, verified
# kernel.org's signature coordinator-side and pinned its bytes before this
# target ran, so the build stays offline and no build root needs a PGP
# implementation. It previously arrived as org.kernel.linux-source, a package
# whose only payload was the tarball, which the Debian reference rung could not
# deliver at all. The guard names the cause should a pekit that predates
# delegated inputs build this through a recipe that does not declare it.
: "${PEKIT_INPUT_LINUX:?no [input.linux]: this pekit does not pass a delegated source's inputs to its build}"

# Copied through tar rather than cp, because the two rungs disagree about cp.
# `cp -a` asks for the whole security descriptor and the native coreutils fails
# with ENOSYS reading one on a host without KACS; naming attributes instead does
# not help, because the vocabularies differ — GNU has `mode` and no `exec`, the
# native one has `exec` and no `mode`, and plain -R preserves nothing there. A
# tar stream carries modes, symlinks, hardlinks and mtimes identically on both,
# and carries no security descriptors to fail on.
tar -cf - -C "$PEKIT_INPUT_LINUX" . | tar -xf - -C "$PEKIT_OUT"

# Source-level prep hook: nothing needed today (patches apply to a pristine
# tree). Config/toolchain prep belongs to the later build stages, not here.
"""

[build.upstream.dependencies.peipkg]
"org.git.kernel.dash"       = "*"
"dev.peios.peiosutils"      = "*"
"org.gnu.tar"               = "*"

[build.upstream.dependencies.apt]
coreutils = "*"
tar = "*"

[build.source]
needs = ["upstream"]
command = """
set -eu
PATCHES="$(pwd)/kernel/patches"
tar -C "$PEKIT_UPSTREAM_OUT" -cf - . | tar -C "$PEKIT_OUT" -xf -
./kernel/apply-patches.sh "$PEKIT_OUT" "$PATCHES"
./kernel/stage-sources.sh "$(pwd)" "$PEKIT_OUT"
# Keep the staged source a plain tree so scripts/setlocalversion cannot inherit
# repository state and change the kernel release. The packaged upstream source
# is already VCS-free; keep this defensive for developer-local inputs.
rm -rf "$PEKIT_OUT/.git"
"""

# apply-patches.sh uses GNU patch; stage-sources.sh uses patch + python3.
[build.source.dependencies.peipkg]
"org.git.kernel.dash"  = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.bash"         = "*"
"org.gnu.findutils"    = "*"
"org.gnu.gawk"         = "*"
"org.gnu.grep"         = "*"
"org.gnu.patch"        = "*"
"org.gnu.tar"          = "*"
"org.python.python3"   = "*"

[build.source.dependencies.apt]
bash = "*"
findutils = "*"
gawk = "*"
grep = "*"
patch = "*"
python3 = "*"
tar = "*"

# build.source is config-agnostic (the kernel-source package). The kernel
# stages take it, configure for a profile, and compile a monolithic bzImage.

[build.kunit]
keyring_inputs = ["modsig.pub"]
needs = ["source"]
command = """
. ./build/toolchain.lock
actual_rust=$(rustc --version | cut -d' ' -f2)
test "$actual_rust" = "$RUST_VERSION" || {
	echo "pkm: selected rustc $actual_rust, kernel requires $RUST_VERSION" >&2
	exit 1
}

tar -C "$PEKIT_SOURCE_OUT" -cf - . | tar -C "$PEKIT_OUT" -xf -
# Only the public certificate enters the worker. Module signatures are
# attached by Pekit after modules_install and worker shutdown.
printf '%s\n' "$PEKIT_KEYRING_MODSIG_PUB" > "$PEKIT_OUT/certs/peios-modsig.pem"
export PKM_MODSIG_KEY="certs/peios-modsig.pem"
./build/configure-kernel.sh "$PEKIT_OUT" kunit
./build/compile-kernel.sh "$PEKIT_OUT"
"""

# Full kernel build: the LLVM toolchain (clang/lld/llvm + libclang for bindgen —
# in the peipkg pool libclang.so and the resource headers ride inside the clang
# package, so no clang-devel there), plus the classic kernel C build deps — bc,
# bison, flex, libelf (CONFIG/objtool), openssl (cert/sig), dwarves/pahole (BTF),
# cpio (initramfs), kmod, python3, perl.
# The Rust toolchain: on the apt side it is NOT a distro package — the
# pkm-build container's rustup provides it via the env/wrap. On the peipkg
# side rust (rustc+cargo+rustfmt+rust-src) and bindgen ARE pool packages,
# declared below; the kernel enter wrapper points RUST_LIB_SRC at the
# triplet-dir rustlib the rust package ships.
[build.kunit.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.gnu.bash" = "*"
"org.gnu.gzip" = "*"
"com.facebook.zstd" = "*"
"org.rust-lang.rust" = "= 1.83.0"
"io.github.rust-lang.bindgen" = "*"
"org.gnu.gcc" = "*"
"org.gnu.gcc-c++" = "*"
"org.gnu.make" = "*"
"org.llvm.clang" = "= 18.1.8"
"org.llvm.lld" = "= 18.1.8"
"org.llvm.llvm" = "= 18.1.8"
"org.gnu.bc" = "*"
"org.gnu.bison" = "*"
"io.github.westes.flex" = "*"
"org.sourceware.elfutils-devel" = "*"
"org.openssl.openssl-devel" = "*"
"org.openssl.openssl" = "*"
"org.kernel.pahole" = "*"
"org.gnu.cpio" = "*"
"org.kernel.kmod" = "*"
"org.python.python3" = "*"
"org.perl.perl" = "*"
"org.gnu.tar" = "*"
"org.tukaani.xz" = "*"

[build.kunit.dependencies.apt]
build-essential = "*"
clang-18 = "*"
lld-18 = "*"
llvm-18 = "*"
libclang-18-dev = "*"
bc = "*"
bison = "*"
flex = "*"
libelf-dev = "*"
libssl-dev = "*"
openssl = "*"
dwarves = "*"
cpio = "*"
kmod = "*"
python3 = "*"
perl = "*"
tar = "*"
xz-utils = "*"
# CONFIG_KERNEL_ZSTD compresses the image with the zstd CLI
# (com.facebook.zstd above).
zstd = "*"

[build.kernel]
keyring_inputs = ["modsig.pub", "tcb.pub"]
needs = ["source"]
command = """
. ./build/toolchain.lock
actual_rust=$(rustc --version | cut -d' ' -f2)
test "$actual_rust" = "$RUST_VERSION" || {
	echo "pkm: selected rustc $actual_rust, kernel requires $RUST_VERSION" >&2
	exit 1
}

# Same assertion as build.headers, for `dev.peios.linux-kernel` — see that
# stage.
sh ./kernel/verify-linux-provide.sh \
	packages.pekit/kernel.package.pekit.toml \
	dev.peios.linux-kernel "$KERNEL_VERSION" "$PEKIT_SOURCE_OUT"

tar -C "$PEKIT_SOURCE_OUT" -cf - . | tar -C "$PEKIT_OUT" -xf -
# Inject the production TCB signing key over the allow-empty placeholder that
# build.source stages. Provide it via the keyring: --keyring.tcb.pub=<hex>.
python3 kernel/scripts/generate-kacs-builtin-signing-keys.py \
	--pubkey-hex "$PEKIT_KEYRING_TCB_PUB" \
	--out "$PEKIT_OUT/security/pkm/kacs/builtin_signing_keys.h"
# Only the public certificate enters the worker. Module signatures are
# attached by Pekit after modules_install and worker shutdown.
printf '%s\n' "$PEKIT_KEYRING_MODSIG_PUB" > "$PEKIT_OUT/certs/peios-modsig.pem"
export PKM_MODSIG_KEY="certs/peios-modsig.pem"
./build/configure-kernel.sh "$PEKIT_OUT" production "-peios-$PEKIT_VERSION"
./build/compile-kernel.sh "$PEKIT_OUT"
./build/install-modules.sh "$PEKIT_OUT" "$PEKIT_OUT/modules-root"
# The initramfs subset is carved from the tree above rather than installed
# again, so both packages describe the same build of the same modules.
./build/install-modules-irf.sh "$(pwd)" "$PEKIT_OUT/modules-root" \
	"$PEKIT_OUT/modules-irf-root" "$PEKIT_OUT/System.map"
# Last, once nothing here needs them unstripped: kernel-devel's host programs
# ship stripped, their debug data in kernel-tools-debuginfo.
./build/split-host-debug.sh "$PEKIT_OUT" "$PEKIT_OUT/host-debug"
# kernel-devel ships scripts/ as it stands in the tree. A few scripts upstream
# gives a #! line but no execute bit (nsdeps, orc_hash.sh, spdxcheck-test.sh);
# Kbuild runs them through $(CONFIG_SHELL), but an installed file that names
# its interpreter is executable.
find "$PEKIT_OUT/scripts" -type f -exec sh -c '
	for f do
		if [ "$(head -c 2 "$f")" = "#!" ] && [ ! -x "$f" ]; then chmod 0755 "$f"; fi
	done' sh {} +
"""

# Sign both installed module sets after the worker is gone. Private key
# material is resolved by Pekit's coordinator and never exported to the build.
[build.kernel.sign.module]
"modules-root/**/*.ko.zst" = "modsig.priv"
"modules-irf-root/**/*.ko.zst" = "modsig.priv"

# Same toolchain as build.kunit (production profile); the keygen step adds python3
# (already required). Rust toolchain comes from the build env/wrap, as above.
[build.kernel.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.gnu.bash" = "*"
"org.gnu.gzip" = "*"
"com.facebook.zstd" = "*"
"org.rust-lang.rust" = "= 1.83.0"
"io.github.rust-lang.bindgen" = "*"
"org.gnu.gcc" = "*"
"org.gnu.gcc-c++" = "*"
"org.gnu.make" = "*"
"org.llvm.clang" = "= 18.1.8"
"org.llvm.lld" = "= 18.1.8"
"org.llvm.llvm" = "= 18.1.8"
"org.gnu.bc" = "*"
"org.gnu.bison" = "*"
"io.github.westes.flex" = "*"
"org.sourceware.elfutils-devel" = "*"
"org.openssl.openssl-devel" = "*"
"org.openssl.openssl" = "*"
"org.kernel.pahole" = "*"
"org.gnu.cpio" = "*"
"org.kernel.kmod" = "*"
"org.python.python3" = "*"
"org.perl.perl" = "*"
"org.gnu.tar" = "*"
"org.tukaani.xz" = "*"

[build.kernel.dependencies.apt]
build-essential = "*"
clang-18 = "*"
lld-18 = "*"
llvm-18 = "*"
libclang-18-dev = "*"
bc = "*"
bison = "*"
flex = "*"
libelf-dev = "*"
libssl-dev = "*"
openssl = "*"
dwarves = "*"
cpio = "*"
kmod = "*"
python3 = "*"
perl = "*"
tar = "*"
xz-utils = "*"
# CONFIG_KERNEL_ZSTD and CONFIG_MODULE_COMPRESS_ZSTD (com.facebook.zstd above).
zstd = "*"

# Export the sanitized userspace UAPI headers (full Linux UAPI + our pkm/*.h,
# which ride along since they're staged under include/uapi/pkm). Depends on
# source, not the compiled kernel — headers come from include/uapi and need no
# build. O= directs the host-tool build (unifdef) + the headers into this
# stage's own out, leaving the source tree pristine and avoiding a tree copy.
# (headers_install is a transformation the package [files] maps can't do;
# everything else the kernel packages need is carved straight from build.kernel.)
[build.headers]
needs = ["source"]
command = """
# kernel-headers publishes the Linux version as
# `dev.peios.linux-kernel-headers`, a qualified versioned virtual provide, so
# consumers can require a UAPI level without depending on pkm's SemVer (which
# tracks the PKM/KACS ABI, not Linux). That provide is static TOML, so assert it
# against KERNEL_VERSION and against the staged tree rather than trusting the
# two were bumped together.
sh ./kernel/verify-linux-provide.sh \
	packages.pekit/kernel-headers.package.pekit.toml \
	dev.peios.linux-kernel-headers "$KERNEL_VERSION" "$PEKIT_SOURCE_OUT"

make -C "$PEKIT_SOURCE_OUT" O="$PEKIT_OUT" LLVM="${PKM_LLVM:--18}" ${PKM_HOSTCC:+HOSTCC="$PKM_HOSTCC"} headers_install INSTALL_HDR_PATH="$PEKIT_OUT/usr"
"""

# headers_install builds the unifdef host tool with HOSTCC (defaults to
# clang-18 via LLVM=-18 in the container; a composed peipkg root sets
# PKM_LLVM=1 / PKM_HOSTCC=gcc — see build/compile-kernel.sh for the knob
# rationale), so it needs make + the clang toolchain (no kernel C libs);
# the final INSTALL step copies the tree with rsync.
[build.headers.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.gnu.gcc" = "*"
"org.gnu.make" = "*"
"org.llvm.clang" = "= 18.1.8"
"org.llvm.lld" = "= 18.1.8"
"org.llvm.llvm" = "= 18.1.8"
"org.samba.rsync" = "*"

[build.headers.dependencies.apt]
build-essential = "*"
clang-18 = "*"
lld-18 = "*"
llvm-18 = "*"
rsync = "*"

# Kernel debug artifacts: the whole vmlinux at the conventional debug path + a
# build-id symlink (-> kernel-debuginfo), and the DWARF-referenced sources with
# their baked-in build path sanitized via debugedit (-> kernel-debugsource).
# objcopy/readelf/debugedit are transformations the package [files] maps can't
# do; everything else the kernel packages need is carved straight from build.kernel.
[build.debuginfo]
needs = ["kernel"]
command = """
./build/make-debuginfo.sh "$PEKIT_KERNEL_OUT" "$PEKIT_OUT"
"""

# Splits vmlinux debug info: debugedit + binutils (readelf/strip/objcopy).
[build.debuginfo.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.gnu.bash" = "*"
"org.gnu.binutils" = "*"
"org.sourceware.debugedit" = "*"
"org.gnu.cpio" = "*"

[build.debuginfo.dependencies.apt]
binutils = "*"
debugedit = "*"
cpio = "*"
# make-debuginfo.sh runs `make kernelrelease` (make comes from
# dev.peios.build-essentials above).
build-essential = "*"

# In-tree userspace tooling (perf, bpftool, cpupower, turbostat, rtla, rv). These
# are userspace ELF programs that live under tools/ in the kernel source, so they
# build from the same staged source (needs=source) rather than a separate pipeline
# — only their userspace lib deps are extra (in the image, unused by build.kernel).
# One stage builds all of them into a DESTDIR image; the per-tool packages carve
# from it. Independent of the compiled kernel.
[build.tools]
needs = ["source"]
command = """
./build/build-tools.sh "$PEKIT_SOURCE_OUT" "$PEKIT_OUT"
"""

# The in-tree userspace tools (perf, bpftool, cpupower, turbostat, rtla, rv) pull
# in the widest dep set — perf's optional integrations dominate. These libs are
# used by build.tools only (never by the kernel build). bison/flex build perf's
# own parsers; the rest are the -dev libs perf/rtla/rv link (see build/Containerfile
# for the per-library rationale).
[build.tools.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.gnu.bash" = "*"
"org.gnu.which" = "*"
"org.samba.rsync" = "*"
"org.openssl.openssl-devel" = "*"
"org.gnu.gcc" = "*"
"org.gnu.gcc-c++" = "*"
"org.gnu.make" = "*"
"org.gnu.bison" = "*"
"io.github.westes.flex" = "*"
"org.pkgconf.pkgconf" = "*"
"org.sourceware.elfutils-devel" = "*"
"io.github.zlib-ng.zlib-ng-compat-devel" = "*"
"com.facebook.zstd-devel" = "*"
"org.kernel.libcap-devel" = "*"
"io.github.numactl.libnuma-devel" = "*"
"org.jedsoft.slang-devel" = "*"
"org.linux.traceevent-devel" = "*"
"org.linux.tracefs-devel" = "*"
"cz.ucw.libpci-devel" = "*"
"org.gnu.gettext" = "*"
"org.perl.perl" = "*"
"org.gnu.binutils" = "*"
"org.python.python3-devel" = "*"
"net.sourceforge.perfmon2.libpfm-devel" = "*"
"io.github.eudev-project.eudev-devel" = "*"
"org.gnu.ncurses-devel" = "*"
"io.github.thom311.libnl-devel" = "*"
"io.github.hyperrealm.libconfig-devel" = "*"
"org.gnu.autoconf" = "*"
"org.gnu.automake" = "*"
"org.gnu.libtool" = "*"
"org.capstone-engine.capstone-devel" = "*"
"org.llvm.llvm-devel" = "*"
"org.llvm.llvm" = "*"
"org.llvm.clang" = "*"
# rst2man for the bpftool/rtla/rv man pages (PEI-535 brought docutils to the pool).
"io.sourceforge.docutils.docutils" = "*"
# asciidoc + xmlto render the perf, libperf and kvm_stat man pages; the
# DocBook stylesheets and DTD are what they resolve against.
"io.github.asciidoc-py.asciidoc" = "*"
"io.pagure.xmlto" = "*"
"org.docbook.docbook-xsl" = "*"
"org.oasis-open.docbook-xml" = "*"
# setuptools builds perf's importable python module (util/setup.py).
"io.pypa.setuptools" = "*"
# gzip compresses every manual page; binutils (above) splits the debug data.
"org.gnu.gzip" = "*"

[build.tools.dependencies.apt]
build-essential = "*"
gzip = "*"
bison = "*"
flex = "*"
pkg-config = "*"
libdw-dev = "*"
zlib1g-dev = "*"
libzstd-dev = "*"
libcap-dev = "*"
libnuma-dev = "*"
libslang2-dev = "*"
libtraceevent-dev = "*"
libtracefs-dev = "*"
libpci-dev = "*"
gettext = "*"
libperl-dev = "*"
binutils-dev = "*"
python3-dev = "*"
python3-docutils = "*"
python3-setuptools = "*"
libpfm4-dev = "*"
asciidoc = "*"
xmlto = "*"
# xmlto validates the perf/libperf man pages against the DocBook 4.5 DTD and
# renders them with the DocBook stylesheets. Both must be present locally: with
# neither, libxml2 falls through to fetching the DTD over HTTP and the build --
# which has no network -- fails every man page (PEI-552). Mirrors the peipkg
# list above; keep the two in step.
docbook-xml = "*"
docbook-xsl = "*"
libudev-dev = "*"
libncurses-dev = "*"
libnl-3-dev = "*"
libnl-genl-3-dev = "*"
libconfig-dev = "*"
autoconf = "*"
automake = "*"
libtool = "*"
libcapstone-dev = "*"
llvm-18-dev = "*"
# perf builds with BUILD_BPF_SKEL=1, and perf and bpftool both reach for the
# unversioned clang, llvm-strip and llvm-config (tools/scripts/Makefile.include).
# They need one coherent LLVM: once an llvm-config is on the path they compile
# against its headers, so installing `llvm` without `llvm-dev` breaks bpftool's
# jit_disasm.c on a missing llvm-c/Core.h. These are Debian's default-version
# names, as the peipkg list's org.llvm.clang, org.llvm.llvm and
# org.llvm.llvm-devel are unpinned there. perf's bootstrap bpftool also compiles
# sign.c against the OpenSSL headers (org.openssl.openssl-devel).
clang = "*"
llvm = "*"
llvm-dev = "*"
libssl-dev = "*"
# getdelays is built against this kernel's own UAPI via `make headers_install`,
# which copies the headers with rsync (org.samba.rsync).
rsync = "*"
libbpf-dev = "*"
bpftool = "*"
libcpupower-dev = "*"
libdebuginfod-dev = "*"
systemtap-sdt-dev = "*"
libbabeltrace-dev = "*"
default-jdk = "*"
source-highlight = "*"
python3 = "*"
perl = "*"

# Boot the KUnit kernel in QEMU and assert the suite passes (build vs run split).
[test.kunit]
gate = true
needs = ["kunit"]
command = """
./build/test-kunit.sh "$PEKIT_KUNIT_OUT"
"""

# The workspace isolates every target, so the stage sees only what it
# declares: without these it has no shell to start the script with, and no
# QEMU to boot the kernel in (org.qemu.qemu-system-x86, PEI-534).
[test.kunit.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"org.gnu.bash"             = "*"
"dev.peios.peiosutils"     = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.qemu.qemu-system-x86" = "*"

[test.kunit.dependencies.apt]
bash            = "*"
coreutils       = "*"
grep            = "*"
sed             = "*"
qemu-system-x86 = "*"

# Boot the same KACS-enabled kernel with a purpose-built initramfs and exercise
# StrataFS through real mount/open/read/write/mmap/xattr/link/rename syscalls.
# Prove the module-signing chain on the modular kernel: boot it with a minimal
# initramfs, load a signed module, and confirm a corrupted one is refused. With
# MODULE_SIG_FORCE a successful load is itself the proof that the signature
# verified against a builtin key.
[test.modsig]
gate = true
needs = ["kernel"]
command = """
./build/test-modsig.sh "$PEKIT_KERNEL_OUT" "$PEKIT_KERNEL_OUT/modules-root"
"""

# What the script shells out to. Under --env peipkg the composed root is
# fsbase plus exactly this list — no implicit shell, so without `dash` (for
# pekit's /usr/bin/sh) and `bash` (the script's own interpreter) bwrap cannot
# even start it (PEI-489). The docker env and --env none use the host's QEMU.
[test.modsig.dependencies.peipkg]
"org.git.kernel.dash"          = "*"
"org.gnu.bash"                 = "*"
"dev.peios.peiosutils"         = "*"
"org.gnu.findutils"            = "*"
"org.gnu.grep"                 = "*"
"org.gnu.gawk"                 = "*"
"org.gnu.cpio"                 = "*"
"dev.peios.build-essentials-c" = "*"
# The initramfs /init is linked with gcc -static.
"org.gnu.glibc-static"         = "*"
"org.gnu.gcc-libatomic-static" = "*"
"org.qemu.qemu-system-x86"     = "*"

[test.modsig.dependencies.apt]
bash            = "*"
coreutils       = "*"
findutils       = "*"
grep            = "*"
gawk            = "*"
cpio            = "*"
build-essential = "*"
qemu-system-x86 = "*"

# Firmware fixtures are prepared in a worker and signed by the coordinator.
# The boot test consumes those signatures without receiving the TCB key.
[build.fwsig]
needs = ["kernel"]
command = './build/prepare-fwsig.sh "$PEKIT_KERNEL_OUT" "$PEKIT_KERNEL_OUT/modules-root" "$PEKIT_OUT"'

[build.fwsig.sign.pip]
"root/lib/firmware/fwsig-good.bin" = "tcb.priv"
