[package]
name = "ntfe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "NTFE's device, /dev/peios-ntfe, for userspace: engine status, the verdict stream, and the counters, flows and listeners dumps, decoded"

[dependencies]
# The records as the kernel lays them out: generated from uapi/pkm/ntfe.h,
# with layout tests against the header. This crate only decodes them.
peios-uapi = { path = "../../uapi/generated/rust", default-features = false }
libc = "0.2"
