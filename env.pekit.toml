# Standalone developer builds only: `pekit` run in this checkout wraps every
# stage in the pkm-build container (build/Containerfile), which carries the
# pinned toolchain of build/toolchain.lock, Rust 1.83 through rustup included.
#
# The pkgs workspace ignores this file. There each target runs in the
# workspace's isolated sandbox, in a root composed from exactly the target's
# declared dependencies (catalogue packages natively, Debian packages for the
# seed build), and the sandbox replaces any [wrap]. Nothing here reaches a
# catalogue build, so a dependency must be declared in pekit.toml, not relied
# on from this image.
[wrap]
# --user keeps everything the container writes (out/, regenerated bindings)
# owned by the host user instead of root; HOME=/tmp gives a writable home for
# tool caches (Go build cache etc.). The image is built to run rootless (Rust
# in /opt, /ccache world-writable).
#
# Persist ccache across runs (named volume — created on demand, no host dep) so
# incremental rebuilds don't recompile cold after each stage's fresh source copy.
# Not adding --device /dev/kvm: it'd force kvm on every runner; test-kunit.sh
# uses -machine accel=kvm:tcg and falls back to TCG, so this stays portable.
#
# Mount BOTH $PWD (the stage's CWD) and $PEKIT_ROOT (the per-build root that holds
# the source checkout + every build/<stage> output): a build here runs with CWD at
# the recipe and outputs underneath it, but a delegating recipe run without the
# workspace sandbox runs with CWD at the fetched source while outputs live in a
# sibling dir, so $PWD alone misses them. The two mounts may overlap or be
# disjoint (--local) — both are fine.
command = 'docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e PKM_JOBS -v "$PWD":"$PWD" -v "$PEKIT_ROOT":"$PEKIT_ROOT" -w "$PWD" -v pkm-ccache:/ccache pkm-build sh -euc {{command}}'
